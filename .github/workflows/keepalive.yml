# Keeps the free-tier Render web service from spinning down.
#
# WHY THIS EXISTS
# ---------------
# `apex-scholarship-api` runs on Render's **free** compute plan, which spins the
# instance down after 15 consecutive minutes without inbound traffic and takes
# about a minute to spin back up. The Apex site aborts its scholarship fetch
# after 8 seconds (REQUEST_TIMEOUT_MS in src/lib/scholarships/client.ts), so a
# cold start is indistinguishable from an outage: the visitor silently gets the
# six curated FALLBACK_SCHOLARSHIPS instead of the 28 real ones. On a site with
# gaps in its traffic, that is most first visitors.
#
# A request every 10 minutes keeps the instance warm, so the site's fetch
# always lands on a running service.
#
# WHY /_keepalive AND NOT /api/health
# -----------------------------------
# `/api/health` runs `select 1`, which also wakes the Neon compute and holds it
# awake. Neon's free plan meters compute time, so pinging a database-backed
# route spends two budgets to warm one service. `/_keepalive` matches no route,
# so Next.js answers 404 in well under a second without touching Postgres —
# and any inbound HTTP request, 404 included, is what Render counts as traffic.
#
# WHY NOT 24/7
# ------------
# Render grants 750 free instance hours per workspace per calendar month and
# SUSPENDS every free web service for the rest of the month once they are gone.
# Warm around the clock is ~744 hours in a 31-day month: a margin thin enough
# that one more free service in the workspace takes the API offline. The window
# below is 18 hours a day (06:00-23:59 WAT) — about 558 hours a month, which
# leaves real headroom and covers the hours Nigerian visitors are actually
# awake. Overnight, the first visitor pays one cold start.
#
# Widen the window by editing the hour range in the cron below; drop this
# workflow entirely if the service is ever moved to a paid Render plan, which
# does not spin down.
name: Keep scholarship API warm

on:
  schedule:
    # Every 10 minutes, 05:00-22:59 UTC (= 06:00-23:59 WAT, UTC+1).
    # GitHub's shared runners can delay scheduled jobs by several minutes, so
    # the cadence is deliberately well inside Render's 15-minute idle window.
    - cron: '*/10 5-22 * * *'
  workflow_dispatch:

# A delayed run must never pile up behind the next one.
concurrency:
  group: keepalive
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the API
        run: |
          # --max-time 120 covers a full cold start: if the instance *was*
          # asleep this request is the one that pays for waking it, and that
          # is the point. 404 is the expected success code.
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 120 \
                   --retry 2 --retry-delay 15 --retry-all-errors \
                   'https://apex-scholarship-api.onrender.com/_keepalive')
          echo "GET /_keepalive -> HTTP $code"
          # Anything that answered at all means the service is up. A 5xx or an
          # empty reply means it is not, and this job should go red so the
          # failure is visible instead of silently degrading the live site.
          case "$code" in
            2??|3??|4??) echo "Service is awake." ;;
            *) echo "::error::Scholarship API did not respond healthily (HTTP $code)."; exit 1 ;;
          esac
