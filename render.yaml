services:
  # Next.js Public & Admin API (Web Service)
  - type: web
    name: apex-scholarship-api
    env: node
    plan: free
    buildCommand: npm install --include=dev && npx prisma generate && npx prisma migrate deploy && npx prisma db seed && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
      - key: PIPELINE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: PIPELINE_JWT_SECRET
        sync: false
      - key: PIPELINE_REFRESH_TOKEN_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  # BullMQ Pipeline Worker (Background Worker)
  - type: worker
    name: apex-scholarship-worker
    env: node
    plan: starter
    buildCommand: npm install --include=dev && npx playwright install chromium && npx prisma generate
    startCommand: npm run worker
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
      - key: PIPELINE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: PIPELINE_JWT_SECRET
        sync: false

  # Cron Scheduler (Render Cron Job)
  - type: cron
    name: apex-scholarship-scheduler
    env: node
    plan: starter
    schedule: "*/30 * * * *"
    buildCommand: npm install --include=dev && npx prisma generate
    startCommand: npm run scheduler:cron
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
      - key: PIPELINE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
