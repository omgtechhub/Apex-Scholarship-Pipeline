services:
  # 1. Next.js Public & Admin API Web Service
  - type: web
    name: apex-scholarship-api
    env: node
    plan: free
    buildCommand: npm install && npx playwright install-deps chromium && npx playwright install chromium && npx prisma generate && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PIPELINE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: PIPELINE_JWT_SECRET
        sync: false
      - key: PIPELINE_REFRESH_TOKEN_SECRET
        sync: false

  # 2. BullMQ Pipeline Worker
  - type: worker
    name: apex-scholarship-worker
    env: node
    plan: free
    buildCommand: npm install && npx playwright install-deps chromium && npx playwright install chromium && npx prisma generate
    startCommand: npm run worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: PIPELINE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: PIPELINE_JWT_SECRET
        sync: false
      - key: PIPELINE_REFRESH_TOKEN_SECRET
        sync: false

  # 3. 30-Minute Crawl Scheduler
  - type: worker
    name: apex-scholarship-scheduler
    env: node
    plan: free
    buildCommand: npm install && npx prisma generate
    startCommand: npm run scheduler
    envVars:
      - key: NODE_ENV
        value: production
      - key: PIPELINE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
