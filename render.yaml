services:
  # Next.js Public & Admin API + BullMQ Worker + 30-Minute Scheduler (Unified Free Web Service)
  - type: web
    name: apex-scholarship-api
    env: node
    plan: free
    buildCommand: npm install --include=dev && npx playwright install chromium && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
      - key: PIPELINE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: PIPELINE_JWT_SECRET
        sync: false
      - key: PIPELINE_REFRESH_TOKEN_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
