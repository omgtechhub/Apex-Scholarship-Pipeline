version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: scholarship_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: scholarship_pipeline
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d scholarship_pipeline"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: scholarship_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scholarship_api
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/scholarship_pipeline?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: production-secret-key-change-me
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scholarship_worker
    command: ["npm", "run", "worker"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/scholarship_pipeline?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scholarship_scheduler
    command: ["npm", "run", "scheduler"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/scholarship_pipeline?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

volumes:
  postgres_data:
  redis_data:
